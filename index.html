<!DOCTYPE html>
<html lang="pt-br">

<head>
    <title>Gerador de citações</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="title" content="Gerador de citações">
    <meta name="keywords" content="gerador, citações, API">
    <meta name="description" content="Gere citações, com referência a quem as disse ou escreveu">
    <meta name="author" content="Gabriel Vitório dos Santos">
    <meta http-equiv="X-UA-Compatible" content="IE=7">
    <meta http-equiv="X-UA-Compatible" content="IE=Edge">

<body>
  <main class="container">
    <article class="quote-box">
      <h2 id="h2--citacao">Citação do dia</h2>

      <span id="author">Loading...</span>
      <div id="quote-box__div--buttons">

        <button><img src="./img/twitter.png"/>Tweet</button>
      </div>
    </article>
  </main>
  <script src="./js/main.js"></script>
